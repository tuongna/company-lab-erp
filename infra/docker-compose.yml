version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: clt-erp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: clt_admin
      POSTGRES_PASSWORD: clt_password_local
      POSTGRES_DB: clt_erp_dev
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U clt_admin -d clt_erp_dev']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
